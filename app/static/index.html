<script>
  // Apply the stored theme before first paint to avoid a flash.
  (function () {
    try {
      var t = localStorage.getItem('pt-theme');
      if (!t || t === 'system') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#eef1f6' : '#07080b';
    } catch (e) {}
  })();
</script>

<!-- ============ Authentication ============ -->
<div class="auth-screen" id="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-mark"><svg class="icon"><use href="#i-terminal"/></svg></div>
    <h1 id="auth-title">PRIME TERMINAL</h1>
    <p class="lead" id="auth-lead">Sign in to manage this server</p>
    <form id="auth-form" autocomplete="on">
      <div class="field">
        <label for="auth-username">Username</label>
        <input class="input" id="auth-username" name="username" autocomplete="username" required minlength="1" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field" id="auth-password-field">
        <label for="auth-password">Password</label>
        <input class="input" id="auth-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field hidden" id="auth-confirm-field">
        <label for="auth-confirm">Confirm password</label>
        <input class="input" id="auth-confirm" type="password" autocomplete="new-password">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="btn btn-primary btn-lg btn-block" id="auth-submit" type="submit">Sign in</button>
    </form>
    <p class="auth-note" id="auth-note">
      Protected server access. Failed sign-in attempts are rate limited.
    </p>
  </div>
</div>

<!-- ============ Application shell ============ -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-terminal"/></svg></div>
      <div class="brand-text">
        <span class="brand-title">PRIME TERMINAL</span>
        <span class="brand-sub" id="brand-host">linux control</span>
      </div>
    </div>
    <nav class="nav-group" id="nav-main"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-status">
        <span class="dot pulse" id="side-dot"></span>
        <span id="side-status">Connected</span>
      </div>
    </div>
  </aside>
  <div class="sidebar-scrim hidden" id="sidebar-scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" aria-label="Open navigation">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar-titles">
        <h1 id="page-title">Dashboard</h1>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon"><use href="#i-sun"/></svg>
        </button>
        <button class="avatar" id="avatar-btn" aria-label="Account menu">U</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
